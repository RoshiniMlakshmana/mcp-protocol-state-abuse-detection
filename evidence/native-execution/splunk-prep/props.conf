# Sourcetype definition for native SPL validation of Track 1/2/3.
#
# This project's SPL queries (detections/spl/*.spl) reference dotted field names directly
# (e.g. 'mcp.subscription.id') with no `| spath` command anywhere in the query body -- they
# assume the ingestion pipeline already extracts these at index/search time. This props.conf
# is the missing piece that makes that assumption true: KV_MODE=json performs Splunk's standard
# automatic JSON field extraction (each JSON key becomes a field; a JSON array of scalars
# becomes a genuine Splunk multivalue field), and the fixture JSONL files already use FLAT
# top-level keys containing literal dots (e.g. "mcp.subscription.id": "20101", not a nested
# {"mcp":{"subscription":{"id":...}}} object) -- so no dot-flattening behavior is even
# exercised; each key is used exactly as its own field name.
#
# TIME_PREFIX/TIME_FORMAT extract _time from each event's own "timestamp" field at ingestion
# time, matching every *.spl file's assumption that _time already reflects it (none of them
# compute _time from a "timestamp" field themselves).
[mcp:audit:json]
KV_MODE = json
TIME_PREFIX = "timestamp":\"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
MAX_TIMESTAMP_LOOKAHEAD = 30
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
disabled = false
